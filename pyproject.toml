[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-watch"
version = "0.1.0"
description = "Watch Instagram stories and post new items to a Discord webhook"
requires-python = ">=3.11"
dependencies = [
    "instaloader>=4.13",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3"]

[project.scripts]
story-watch = "story_watch.main:cli"

[tool.setuptools]
packages = ["story_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
