[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story-watch"
version = "0.1.0"
description = "Watch Instagram stories and post new items to a Discord webhook"
requires-python = ">=3.11"
dependencies = [
    "instaloader>=4.13",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "discord.py>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=3"]
# RapidOCR for CLASSIFIER=hybrid (story_watch/ocr.py), the versions #10 measured. install.sh installs it.
ocr = ["rapidocr==3.10.0", "onnxruntime==1.30.0", "numpy>=1.26", "pillow>=10"]

[project.scripts]
story-watch = "story_watch.main:cli"
story-watch-bot = "story_watch.bot.main:cli"

[tool.setuptools]
packages = ["story_watch", "story_watch.bot", "story_watch.evaluation"]

[tool.setuptools.package-data]
story_watch = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
