# One synthetic user per tag value, for a more sensitive missed-ping count than eval/ping_configs.toml (#10).
# Job-posting dimensions are paired with post_type:job_posting (the default); the post-type users list only that type.

[[config]]
name = "only-post_type-event"
description = "Ping me: post_type:event"
ping_me = ["post_type:event"]

